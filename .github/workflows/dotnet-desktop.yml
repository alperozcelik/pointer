name: .NET Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\Pointer.csproj

      - name: Build
        run: dotnet build .\Pointer.csproj --configuration ${{ matrix.configuration }} --no-restore

      # No test project or MSIX packaging project exists in this repository.
      # This framework-dependent package requires the .NET 10 Desktop Runtime.
      - name: Publish Release
        if: matrix.configuration == 'Release'
        run: dotnet publish .\Pointer.csproj --configuration Release --no-build --no-restore --output .\artifacts\Pointer

      - name: Copy Release to binary folder
        if: matrix.configuration == 'Release'
        run: |
          New-Item -ItemType Directory -Path .\binary -Force | Out-Null
          Copy-Item -Path .\artifacts\Pointer\* -Destination .\binary -Recurse -Force
          if (-not (Test-Path -LiteralPath .\binary\Pointer.exe)) {
            throw 'The published Pointer executable is missing.'
          }

      - name: Upload Release
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Pointer-Release
          path: artifacts\Pointer\
          if-no-files-found: error

      - name: Upload binary folder
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Pointer-binary
          path: binary\
          if-no-files-found: error
