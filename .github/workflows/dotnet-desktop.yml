name: .NET Desktop

on:
  push:
    branches: [main]
    paths-ignore:
      - 'binary/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\Pointer.csproj

      - name: Build
        run: dotnet build .\Pointer.csproj --configuration ${{ matrix.configuration }} --no-restore

      # No test project or MSIX packaging project exists in this repository.
      # Bundle the .NET runtime and native libraries into one Windows x64 executable.
      - name: Publish Release
        if: matrix.configuration == 'Release'
        run: >-
          dotnet publish .\Pointer.csproj --configuration Release
          --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          --output .\artifacts\Pointer

      - name: Copy Release to binary folder
        if: matrix.configuration == 'Release'
        run: |
          $files = @(Get-ChildItem -LiteralPath .\artifacts\Pointer -Force)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'Pointer.exe') {
            throw 'Publish output must contain only Pointer.exe.'
          }
          if (Test-Path -LiteralPath .\binary) {
            Remove-Item -LiteralPath .\binary -Recurse -Force
          }
          New-Item -ItemType Directory -Path .\binary -Force | Out-Null
          Copy-Item -LiteralPath .\artifacts\Pointer\Pointer.exe -Destination .\binary\Pointer.exe
          if (-not (Test-Path -LiteralPath .\binary\Pointer.exe)) {
            throw 'The published Pointer executable is missing.'
          }

      - name: Upload Release
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Pointer-Release
          path: artifacts\Pointer\
          if-no-files-found: error

      - name: Upload binary folder
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Pointer-binary
          path: binary\
          if-no-files-found: error

  push-binaries:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout built revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Remove previous binaries
        run: |
          if (Test-Path -LiteralPath .\binary) {
            Remove-Item -LiteralPath .\binary -Recurse -Force
          }

      - name: Download binary folder
        uses: actions/download-artifact@v4
        with:
          name: Pointer-binary
          path: binary

      - name: Commit and push binaries
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath .\binary\Pointer.exe)) {
            throw 'The downloaded Pointer executable is missing.'
          }
          git config user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure Git user name.' }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure Git user email.' }
          git add --all -- binary
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage binaries.' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Binaries are unchanged; nothing to push.'
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw 'Could not check staged changes.' }
          git commit -m 'Update published binaries [skip ci]' -m 'Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit binaries.' }
          git push origin HEAD:refs/heads/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not push binaries. Check branch rules and Actions write access. If main advanced, rerun the workflow on the latest revision.'
          }
