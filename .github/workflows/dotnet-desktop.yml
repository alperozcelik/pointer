name: .NET Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\Pointer.csproj

      - name: Build
        run: dotnet build .\Pointer.csproj --configuration ${{ matrix.configuration }} --no-restore

      # No test project or MSIX packaging project exists in this repository.
      # WinForms does not support trimming/Native AOT; compress the self-contained bundle instead.
      - name: Publish Release
        if: matrix.configuration == 'Release'
        run: >-
          dotnet publish .\Pointer.csproj --configuration Release
          --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          --output .\artifacts\Pointer

      - name: Verify single executable
        if: matrix.configuration == 'Release'
        run: |
          $files = @(Get-ChildItem -LiteralPath .\artifacts\Pointer -Force)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'Pointer.exe') {
            throw 'Publish output must contain only Pointer.exe.'
          }

      - name: Upload Release
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Pointer-Release
          path: artifacts\Pointer\
          if-no-files-found: error

  publish-release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: pointer-latest-release
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout built revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: Pointer-Release
          path: artifacts\Pointer

      - name: Publish latest download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath .\artifacts\Pointer\Pointer.exe)) {
            throw 'The downloaded Pointer executable is missing.'
          }
          # Do not let a delayed build replace a newer main-branch download.
          $head = gh api "repos/$env:GH_REPO/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the current main revision.' }
          if ($head -ne '${{ github.sha }}') {
            Write-Host 'Main has advanced; skipping this outdated release.'
            exit 0
          }
          $releases = gh api --paginate "repos/$env:GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "latest") | .id'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases.' }
          if (-not $releases) {
            gh release create latest .\artifacts\Pointer\Pointer.exe --target '${{ github.sha }}' --title 'Latest Pointer' --notes 'Rolling Windows x64 build. Download Pointer.exe; no .NET installation required.' --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the latest release.' }
          } else {
            gh release upload latest .\artifacts\Pointer\Pointer.exe --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the executable asset.' }
            gh release edit latest --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not mark the release as latest.' }
          }
